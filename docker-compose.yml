services:
  db:
    image: postgres:16-alpine
    container_name: cnel-sap-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnel_secret_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-cnel_midd}
      TZ: America/Guayaquil
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c synchronous_commit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cnel_user} -d $${POSTGRES_DB:-cnel_midd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cnel_net

  middleware:
    build: .
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-cnel_user}:${POSTGRES_PASSWORD:-cnel_secret_pwd}@db:5432/${POSTGRES_DB:-cnel_midd}
      - DD_AGENT_HOST=host.docker.internal
      - TZ=America/Guayaquil
      - UVICORN_WORKERS=${UVICORN_WORKERS:-3}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-15}
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cnel_net

  nginx:
    image: nginx:1.27-alpine
    container_name: cnel-sap-nginx-lb
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      middleware:
        condition: service_healthy
    restart: always
    networks:
      - cnel_net

volumes:
  postgres_data:

networks:
  cnel_net:
    driver: bridge
