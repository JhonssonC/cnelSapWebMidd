worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Formato de log con trazabilidad de instancia upstream y tiempos de respuesta
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Pool de contenedores backend (resuelve todas las réplicas del servicio 'middleware' en Docker DNS)
    upstream middleware_backend {
        least_conn;
        server middleware:8080 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Endpoint de salud propio del balanceador
        location = /nginx-health {
            access_log off;
            return 200 '{"status":"ok","component":"nginx-lb"}';
        }

        location / {
            proxy_pass http://middleware_backend;
            proxy_http_version 1.1;

            # Reutilización de conexiones keep-alive hacia Uvicorn
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reintento transparente en otra réplica si un contenedor falla o está saturado
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;

            # Timeouts amplios para absorber latencia de SAP OData y portales externos
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffers optimizados para respuestas grandes de órdenes expandidas SAP
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;

            # Exponer qué nodo respondió para diagnóstico
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
